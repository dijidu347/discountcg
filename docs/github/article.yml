name: Article du blog

on:
  # 06:13 UTC = 08:13 à Paris l'été, 07:13 l'hiver. GitHub ne connaît que
  # l'UTC et ne gère pas le changement d'heure ; une heure d'écart est sans
  # importance pour un article de blog.
  # Trois rendez-vous, pas un seul — et le 20 octobre 2026 a montré pourquoi
  # dès le jour de leur installation :
  #
  #     8 h 13  jamais partie
  #     11 h 13 partie à 13 h 29   (2 h 16 de retard)
  #     15 h 13 partie à 16 h 19   (1 h 06 de retard)
  #
  # GitHub sert les tâches programmées des dépôts gratuits en dernier. Il
  # finit par les servir, mais sans aucune garantie d'heure : une fois jamais,
  # une fois avec deux heures de retard. Pour un blog c'est sans importance,
  # à condition de ne pas dépendre d'un seul déclenchement.
  #
  # Les deux exécutions de ce jour-là se sont arrêtées à la première étape,
  # un article portant déjà la date du jour. Sans elle, trois articles.
  schedule:
    - cron: "13 6 * * 2,5"
    - cron: "13 9 * * 2,5"
    - cron: "13 13 * * 2,5"
  # Pour lancer un article à la demande, sans attendre mardi.
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  actions: write

concurrency:
  group: article-blog
  cancel-in-progress: false

jobs:
  rediger:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - name: Identité des commits
        run: |
          git config user.name "Article automatique"
          git config user.email "noreply@discountcartegrise.fr"

      # Avec trois rendez-vous, deux pourraient aboutir le même jour. On
      # s'arrête net si un article porte déjà la date du jour — c'est le seul
      # garde-fou qui rende un déclenchement manqué inoffensif ET un
      # déclenchement en double inoffensif.
      - name: Un article est-il déjà paru aujourd'hui ?
        id: deja
        run: |
          if grep -q "date: \"$(date +%Y-%m-%d)\"" src/data/articles.ts; then
            echo "paru=oui" >> "$GITHUB_OUTPUT"
            echo "Un article porte déjà la date du jour. Rien à faire."
          else
            echo "paru=non" >> "$GITHUB_OUTPUT"
          fi

      - name: Noter la version de départ
        if: steps.deja.outputs.paru == 'non'
        id: avant
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Rédiger et publier l'article
        if: steps.deja.outputs.paru == 'non'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: "Lis le fichier .claude/skills/article-blog/SKILL.md et applique-le à la lettre, de bout en bout."
          claude_args: |
            --model claude-opus-5-5
            --max-turns 100
            --allowedTools "Bash,Read,Write,Edit,Glob,Grep,WebSearch"
          show_full_output: true

      - name: Mettre le site en ligne si un article est sorti
        if: steps.deja.outputs.paru == 'non'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch -q origin main
          APRES=$(git rev-parse origin/main)
          if [ "$APRES" != "${{ steps.avant.outputs.sha }}" ]; then
            echo "Nouveau commit : ${APRES:0:7}. Publication du site."
            gh workflow run pages.yml --ref main
          else
            echo "Aucun nouveau commit — rien à publier."
          fi

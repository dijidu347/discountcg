name: Article du blog

on:
  # 06:13 UTC = 08:13 à Paris l'été, 07:13 l'hiver. GitHub ne connaît que
  # l'UTC et ne gère pas le changement d'heure ; une heure d'écart est sans
  # importance pour un article de blog.
  schedule:
    - cron: "13 6 * * 2,5"
  # Pour lancer un article à la demande, sans attendre mardi.
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  actions: write

concurrency:
  group: article-blog
  cancel-in-progress: false

jobs:
  rediger:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - name: Identité des commits
        run: |
          git config user.name "Article automatique"
          git config user.email "noreply@discountcartegrise.fr"

      - name: Noter la version de départ
        id: avant
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Rédiger et publier l'article
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: "Lis le fichier .claude/skills/article-blog/SKILL.md et applique-le à la lettre, de bout en bout."
          claude_args: |
            --model claude-opus-5-5
            --max-turns 100
            --allowedTools "Bash,Read,Write,Edit,Glob,Grep,WebSearch"
          show_full_output: true

      - name: Mettre le site en ligne si un article est sorti
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch -q origin main
          APRES=$(git rev-parse origin/main)
          if [ "$APRES" != "${{ steps.avant.outputs.sha }}" ]; then
            echo "Nouveau commit : ${APRES:0:7}. Publication du site."
            gh workflow run pages.yml --ref main
          else
            echo "Aucun nouveau commit — rien à publier."
          fi

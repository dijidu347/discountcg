<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#007AFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5856D6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background square with rounded corners -->
  <rect width="400" height="400" rx="80" ry="80" fill="url(#bg)" />
  <!-- Shine overlay -->
  <rect width="400" height="200" rx="80" ry="80" fill="url(#shine)" />

  <!-- Crosshair / Sniper scope icon -->
  <!-- Outer ring -->
  <circle cx="200" cy="170" r="90" fill="none" stroke="white" stroke-width="6" opacity="0.9"/>
  <!-- Middle ring -->
  <circle cx="200" cy="170" r="60" fill="none" stroke="white" stroke-width="4" opacity="0.7"/>
  <!-- Inner ring -->
  <circle cx="200" cy="170" r="30" fill="none" stroke="white" stroke-width="4" opacity="0.9"/>
  <!-- Center dot -->
  <circle cx="200" cy="170" r="8" fill="white" filter="url(#glow)"/>

  <!-- Crosshair lines -->
  <!-- Top -->
  <line x1="200" y1="68" x2="200" y2="100" stroke="white" stroke-width="5" stroke-linecap="round"/>
  <!-- Bottom -->
  <line x1="200" y1="240" x2="200" y2="272" stroke="white" stroke-width="5" stroke-linecap="round"/>
  <!-- Left -->
  <line x1="98" y1="170" x2="130" y2="170" stroke="white" stroke-width="5" stroke-linecap="round"/>
  <!-- Right -->
  <line x1="270" y1="170" x2="302" y2="170" stroke="white" stroke-width="5" stroke-linecap="round"/>

  <!-- Brand name -->
  <text x="200" y="312" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Helvetica Neue', sans-serif" font-size="42" font-weight="800" fill="white" text-anchor="middle" letter-spacing="-1">SniperAuto</text>

  <!-- Tagline -->
  <text x="200" y="346" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', 'Helvetica Neue', sans-serif" font-size="18" font-weight="500" fill="rgba(255,255,255,0.75)" text-anchor="middle" letter-spacing="2">ALERTES TEMPS RÉEL</text>
</svg>
